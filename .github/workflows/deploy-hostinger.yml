name: Build Hostinger branch

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Finalize complete daily publisher branches"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    # A merge made by the finisher may not trigger the normal push workflow
    # when it uses GITHUB_TOKEN. Deploy after a successful finisher completion.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, build the latest default branch commit. For a
          # normal push, use the exact pushed commit.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://techupates.blog
      - name: Publish static site to hostinger-dist
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          mv out /tmp/tech-updates-site
          git config user.name github-actions-bot
          git config user.email a@b
          git checkout --orphan hostinger-dist
          git rm -rf .
          git clean -fdx
          cp -R /tmp/tech-updates-site/. .
          touch .nojekyll
          git add --all
          git commit -m "Deploy-$source_sha"
          git push --force origin hostinger-dist
