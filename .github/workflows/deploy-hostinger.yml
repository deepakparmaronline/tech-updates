name: Deploy to Hostinger
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Hostinger deployment
        if: ${{ secrets.HOSTINGER_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error --request POST "${{ secrets.HOSTINGER_DEPLOY_HOOK }}"
      - name: Explain missing setup
        if: ${{ secrets.HOSTINGER_DEPLOY_HOOK == '' }}
        run: echo "Add HOSTINGER_DEPLOY_HOOK to the production environment, or use Hostinger's native Git integration."
