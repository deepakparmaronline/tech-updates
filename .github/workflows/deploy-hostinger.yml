name: Build Hostinger branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://techupates.blog
      - name: Publish static site to hostinger-dist
        run: |
          mv out /tmp/tech-updates-site
          git config user.name github-actions-bot
          git config user.email a@b
          git checkout --orphan hostinger-dist
          git rm -rf .
          cp -R /tmp/tech-updates-site/. .
          touch .nojekyll
          git add --all
          git commit -m Deploy-$GITHUB_SHA
          git push --force origin hostinger-dist
