name: Deploy to Hostinger
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Hostinger deployment
        env:
          HOSTINGER_DEPLOY_HOOK: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
        run: |
          if [[ -n "$HOSTINGER_DEPLOY_HOOK" ]]; then
            curl --fail --silent --show-error --request POST "$HOSTINGER_DEPLOY_HOOK"
          else
            echo "Add HOSTINGER_DEPLOY_HOOK to the production environment, or use Hostinger's native Git integration."
          fi
