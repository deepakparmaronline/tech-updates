<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">AI spreadsheet analysis review workflow</title><desc id="d">A spreadsheet grid beside a calculation review checklist.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#422006"/><stop offset="1" stop-color="#78350f"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="72" y="82" fill="#fcd34d" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">DATA REVIEW</text><text x="72" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="45" font-weight="700">Check the numbers before sharing</text><rect x="72" y="190" width="700" height="370" rx="20" fill="#fffbeb"/><rect x="96" y="216" width="652" height="48" rx="10" fill="#fcd34d"/><g fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700"><text x="124" y="246">DATE</text><text x="280" y="246">REGION</text><text x="450" y="246">SALES</text><text x="600" y="246">CHECK</text></g><g stroke="#fcd34d" stroke-width="2"><path d="M96 285 H748 M96 330 H748 M96 375 H748 M96 420 H748 M96 465 H748 M96 510 H748"/><path d="M254 264 V534 M426 264 V534 M578 264 V534"/></g><g fill="#92400e" font-family="Arial,sans-serif" font-size="17"><text x="124" y="313">01 Oct</text><text x="280" y="313">North</text><text x="450" y="313">1,240</text><text x="600" y="313">✓</text><text x="124" y="358">08 Oct</text><text x="280" y="358">South</text><text x="450" y="358">980</text><text x="600" y="358">✓</text><text x="124" y="403">15 Oct</text><text x="280" y="403">East</text><text x="450" y="403">1,105</text><text x="600" y="403">!</text><text x="124" y="448">22 Oct</text><text x="280" y="448">West</text><text x="450" y="448">870</text><text x="600" y="448">✓</text></g><rect x="802" y="190" width="326" height="370" rx="20" fill="#fef3c7"/><text x="832" y="238" fill="#78350f" font-family="Arial,sans-serif" font-size="22" font-weight="700">REVIEW STEPS</text><g font-family="Arial,sans-serif" font-size="19" fill="#92400e"><text x="832" y="294">✓ Source rows</text><text x="832" y="344">✓ Filters and dates</text><text x="832" y="394">✓ Formula totals</text><text x="832" y="444">✓ Chart labels</text></g><rect x="832" y="478" width="264" height="58" rx="12" fill="#92400e"/><text x="964" y="514" text-anchor="middle" fill="#fff7ed" font-family="Arial,sans-serif" font-size="18" font-weight="700">Human approval</text><text x="72" y="615" fill="#fff" font-family="Arial,sans-serif" font-size="20">A fluent summary is not a verified calculation.</text></svg>