<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Google AI plan pricing comparison</title><desc id="desc">Four plan cards showing a progression from free access to higher paid tiers.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162b53"/><stop offset="1" stop-color="#326a94"/></linearGradient><linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#dbe9ff"/></linearGradient><linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4f1e9"/><stop offset="1" stop-color="#80d2c9"/></linearGradient><linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8d4ff"/><stop offset="1" stop-color="#a6a0f1"/></linearGradient><linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe6b7"/><stop offset="1" stop-color="#f4b969"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1320" cy="130" r="230" fill="#9cb6ff" opacity=".15"/><circle cx="180" cy="780" r="250" fill="#78e0d4" opacity=".12"/><text x="800" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#fff">GOOGLE AI PLAN COMPARISON</text><g transform="translate(135 245)"><rect width="280" height="400" rx="28" fill="url(#c1)"/><text x="140" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1c416d">FREE</text><circle cx="140" cy="160" r="42" fill="#9fbce8"/><path d="M118 160H162M140 138V182" stroke="#fff" stroke-width="9" stroke-linecap="round"/><rect x="45" y="235" width="190" height="17" rx="8" fill="#a4b9d7"/><rect x="45" y="270" width="150" height="17" rx="8" fill="#a4b9d7"/><text x="140" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#3b5578">Basic access</text></g><g transform="translate(465 205)"><rect width="280" height="440" rx="28" fill="url(#c2)"/><text x="140" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#174d4c">AI PLUS</text><circle cx="140" cy="165" r="42" fill="#2d9f9b"/><path d="M118 165H162M140 143V187" stroke="#fff" stroke-width="9" stroke-linecap="round"/><rect x="45" y="245" width="190" height="17" rx="8" fill="#5bbdb5"/><rect x="45" y="280" width="150" height="17" rx="8" fill="#5bbdb5"/><text x="140" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#174d4c">More access</text></g><g transform="translate(795 165)"><rect width="280" height="480" rx="28" fill="url(#c3)"/><text x="140" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#302d75">AI PRO</text><circle cx="140" cy="175" r="42" fill="#746cdb"/><path d="M118 175H162M140 153V197" stroke="#fff" stroke-width="9" stroke-linecap="round"/><rect x="45" y="255" width="190" height="17" rx="8" fill="#8c85e5"/><rect x="45" y="290" width="150" height="17" rx="8" fill="#8c85e5"/><text x="140" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#302d75">Expanded limits</text></g><g transform="translate(1125 125)"><rect width="280" height="520" rx="28" fill="url(#c4)"/><text x="140" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#754a17">AI ULTRA</text><circle cx="140" cy="185" r="42" fill="#d38a32"/><path d="M118 185H162M140 163V207" stroke="#fff" stroke-width="9" stroke-linecap="round"/><rect x="45" y="265" width="190" height="17" rx="8" fill="#e5ad61"/><rect x="45" y="300" width="150" height="17" rx="8" fill="#e5ad61"/><text x="140" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#754a17">Highest access</text></g><text x="800" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" letter-spacing="3" fill="#d9e9ff">CHECK YOUR COUNTRY AND CURRENT PLAN TERMS</text><text x="8