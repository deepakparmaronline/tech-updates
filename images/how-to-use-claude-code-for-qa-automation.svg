<text x="110" y="220" fill="#ffffff" font-family="Arial,sans-serif" font-size="58" font-weight="700">Claude Code</text>
<text x="110" y="288" fill="#ffffff" font-family="Arial,sans-serif" font-size="58" font-weight="700">for QA automation</text>
<text x="110" y="348" fill="#d7cbe2" font-family="Arial,sans-serif" font-size="25">Agent assistance. Independent test evidence.</text>
