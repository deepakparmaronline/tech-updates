<text x="38" y="180" fill="#d7cbe2" font-family="Arial,sans-serif" font-size="22">Define expected behavior</text>
</g>
<path d="M490 560H575M555 540L577 560L555 580" fill="none" stroke="#b7f1db" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
