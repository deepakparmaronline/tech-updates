<text x="38" y="145" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Test runner</text>
<text x="38" y="180" fill="#d7cbe2" font-family="Arial,sans-serif" font-size="22">Run real checks</text>
