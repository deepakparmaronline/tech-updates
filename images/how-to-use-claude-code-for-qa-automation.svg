<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Claude Code for QA automation</title>
<desc id="desc">An editorial illustration of a testing workflow moving from a test plan to code checks and a reviewed result.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20182f"/><stop offset="1" stop-color="#3b294b"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4c9a8"/><stop offset="1" stop-color="#b7f1db"/></linearGradient></defs>
