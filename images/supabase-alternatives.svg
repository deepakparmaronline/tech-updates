iles</text><text x="965" y="405" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">Operations</text><text x="965" y="435" fill="#a7f3d0" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle">Backups</text><path d="M320 412 H360 M570 412 H610 M820 412 H860" stroke="#6ee7b7" stroke-width="4"/><text x="110" y="548" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="21">Choose by fit, not hype</text><text x="1090" y="572" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end">ALTERNATIVES GUIDE</text></svg>