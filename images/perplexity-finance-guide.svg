<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Perplexity Finance research guide</title><desc id="d">A market chart beside a checklist for source verification.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f2d2c"/><stop offset="1" stop-color="#164e63"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="72" y="82" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">FINANCIAL RESEARCH</text><text x="72" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="45" font-weight="700">Follow the source, not the guess</text><rect x="72" y="190" width="1056" height="380" rx="20" fill="#f0fdfa"/><rect x="98" y="218" width="620" height="326" rx="14" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="128" y="258" fill="#115e59" font-family="Arial,sans-serif" font-size="21" font-weight="700">METRIC OVER TIME</text><path d="M132 480 H680 M132 425 H680 M132 370 H680 M132 315 H680" stroke="#ccfbf1" stroke-width="2"/><path d="M144 455 L206 420 L270 435 L330 362 L392 380 L452 330 L515 350 L580 292 L655 310" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="746" y="218" width="356" height="326" rx="14" fill="#d1fae5"/><text x="778" y="258" fill="#065f46" font-family="Arial,sans-serif" font-size="21" font-weight="700">VERIFY THE CLAIM</text><g font-family="Arial,sans-serif" font-size="19" fill="#064e3b"><text x="778" y="310">✓ Original filing</text><text x="778" y="358">✓ Reporting period</text><text x="778" y="406">✓ Units and currency</text><text x="778" y="454">✓ Source timestamp</text></g><text x="72" y="615" fill="#fff" font-family="Arial,sans-serif" font-size="20">Trace figures to primary records before deciding.</text></svg>