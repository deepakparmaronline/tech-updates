<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Gemini data and training controls</title><desc id="desc">Editorial illustration showing privacy toggles, a chat panel, and a shield.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#052e2b"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><rect width="1600" height="900" rx="36" fill="url(#bg)"/><circle cx="250" cy="120" r="240" fill="#10b981" opacity=".15"/><g transform="translate(120 185)"><rect width="600" height="490" rx="28" fill="#f8fafc"/><rect x="30" y="30" width="540" height="70" rx="18" fill="#e0f2fe"/><circle cx="70" cy="65" r="15" fill="#0284c7"/><path d="M105 65h320" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round"/><text x="38" y="145" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Activity controls</text><rect x="30" y="170" width="540" height="94" rx="16" fill="#f1f5f9"/><text x="52" y="208" font-family="Arial,sans-serif" font-size="22" fill="#334155">Keep Activity</text><rect x="440" y="190" width="92" height="42" rx="21" fill="#cbd5e1"/><circle cx="462" cy="211" r="16" fill="#fff"/><rect x="30" y="282" width="540" height="94" rx="16" fill="#f1f5f9"/><text x="52" y="320" font-family="Arial,sans-serif" font-size="22" fill="#334155">Temporary Chat</text><rect x="440" y="302" width="92" height="42" rx="21" fill="#10b981"/><circle cx="510" cy="323" r="16" fill="#fff"/><rect x="30" y="394" width="540" height="66" rx="16" fill="#dcfce7"/><path d="M58 427l12 12 24-29" stroke="#15803d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="435" font-family="Arial,sans-serif" font-size="21" fill="#166534">Review the setting details</text></g><g transform="translate(850 255)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5" fill="#6ee7b7">PRIVACY GUIDE</text><text x="0" y="110" font-family="Arial,sans-serif" font-size="60" font-weight="700" fill="#fff">Gemini Data</text><text x="0" y="180" font-family="Arial,sans-serif" font-size="60" font-weight="700" fill="#fff">Controls</text><path d="M0 220h570" stroke="#34d399" stroke-width="5"/><text x="0" y="290" font-family="Arial,sans-serif" font-size="29" fill="#d1fae5">Activity, temporary chats,</text><text x="0" y="334" font-family="Arial,sans-serif" font-size="29" fill="#d1fae5">and the limits of each setting.</text><g transform="translate(0 390)"><path d="M48 0l44 16v38c0 30-21 49-44 61-23-12-44-31-44-61V16z" fill="#10b981" opacity=".9"/><path d="M27 57l15 15 29-34" stroke="#052e2b" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="52" font-family="Arial,sans-serif" font-size="25" fill="#fff">Know what each switch does</text></g></g></svg>
