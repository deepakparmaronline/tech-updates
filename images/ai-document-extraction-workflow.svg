<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI document extraction workflow</title><desc id="desc">Extract fields from documents, validate them and send uncertain results to review.</desc><rect width="1200" height="675" fill="#111827"/><rect x="54" y="54" width="1092" height="567" rx="28" fill="#1f2937" stroke="#f472b6" stroke-width="3"/><text x="110" y="140" fill="#fbcfe8" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="5">TECH UPDATES</text><text x="110" y="220" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700">AI Document Extraction</text><text x="110" y="274" fill="#fce7f3" font-family="Arial,Helvetica,sans-serif" font-size="27">Extract, validate, review</text><rect x="110" y="350" width="235" height="105" rx="16" fill="#831843" stroke="#f9a8d4" stroke-width="2"/><rect x="430" y="350" width="235" height="105" rx="16" fill="#831843" stroke="#f9a8d4" stroke-width="2"/><rect x="750" y="350" width="235" height="105" rx="16" fill="#831843" stroke="#f9a8d4" stroke-width="2"/><text x="227" y="393" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">Document</text><text x="227" y="423" fill="#fbcfe8" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle">Original source</text><text x="547" y="393" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">Validate</text><text x="547" y="423" fill="#fbcfe8" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle">Rules and checks</text><text x="867" y="393" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">Human review</text><text x="867" y="423" fill="#fbcfe8" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle">Approve or correct</text><path d="M345 402 H430 M665 402 H750" stroke="#f9a8d4" stroke-width="5"/><path d="M410 389 L430 402 L410 415 M730 389 L750 402 L730 415" fill="none" stroke="#f9a8d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="545" fill="#fbcfe8" font-family="Arial,Helvetica,sans-serif" font-size="21">Keep every value tied to its source</text><text x="110" y="585" fill="#f472b6" font-family="Arial,Helvetica,sans-serif" font-size="18">PRACTICAL WORKFLOW</text></svg>