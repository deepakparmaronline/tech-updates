<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Choosing Manus AI alternatives</title>
  <desc id="desc">Editorial illustration showing a central AI agent connected to research, coding, writing, and workflow cards.</desc>
  <rect width="1600" height="900" fill="#101827"/>
  <circle cx="1270" cy="170" r="220" fill="#233b63" opacity=".45"/>
  <circle cx="260" cy="760" r="250" fill="#243b4a" opacity=".55"/>
  <path d="M800 450 L420 280 M800 450 L1180 280 M800 450 L420 650 M800 450 L1180 650" stroke="#7dd3fc" stroke-width="5" opacity=".7" fill="none"/>
  <rect x="600" y="335" width="400" height="230" rx="34" fill="#182a42" stroke="#7dd3fc" stroke-width="4"/>
  <circle cx="800" cy="405" r="42" fill="#7dd3fc"/>
  <path d="M782 406 L795 419 L820 389" stroke="#101827" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="800" y="480" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">AI Agent</text>
  <text x="800" y="520" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#b9cbe0" text-anchor="middle">Choose by task, not hype</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="190" y="190" width="460" height="160" rx="26" fill="#1d3554" stroke="#60a5fa" stroke-width="3"/>
    <text x="420" y="250" font-size="30" font-weight="700" fill="#ffffff">Research</text>
    <text x="420" y="294" font-size="22" fill="#c8d9ec">Sources and evidence</text>
    <rect x="950" y="190" width="460" height="160" rx="26" fill="#1b3b39" stroke="#5eead4" stroke-width="3"/>
    <text x="1180" y="250" font-size="30" font-weight="700" fill="#ffffff">Coding</text>
    <text x="1180" y="294" font-size="22" fill="#c8e9e3">Build and test software</text>
    <rect x="190" y="570" width="460" height="160" rx="26" fill="#3b2c4f" stroke="#c4b5fd" stroke-width="3"/>
    <text x="420" y="630" font-size="30" font-weight="700" fill="#ffffff">Writing</text>
    <text x="420" y="674" font-size="22" fill="#ded6f3">Draft and analyze</text>
    <rect x="950" y="570" width="460" height="160" rx="26" fill="#47351f" stroke="#fcd34d" stroke-width="3"/>
    <text x="1180" y="630" font-size="30" font-weight="700" fill="#ffffff">Workflows</text>
    <text x="1180" y="674" font-size="22" fill="#f2dfb8">Repeatable app actions</text>
  </g>
  <text x="800" y="830" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#a9bdd4" text-anchor="middle">MANUS AI ALTERNATIVES • TECH UPDATES</text>
</svg>