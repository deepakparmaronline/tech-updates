<text x="110" y="293" fill="#ffffff" font-family="Arial,sans-serif" font-size="58" font-weight="700">is ChatGPT?</text>
<text x="110" y="353" fill="#c8dfe7" font-family="Arial,sans-serif" font-size="25">Confidence is not proof. Check the evidence.</text>
