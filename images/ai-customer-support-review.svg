<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">AI customer support reply review</title><desc id="d">A support ticket, policy check and human approval shield.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#1e40af"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="72" y="82" fill="#93c5fd" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">SUPPORT WORKFLOW</text><text x="72" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="45" font-weight="700">Draft with AI. Approve with care.</text><rect x="72" y="190" width="420" height="360" rx="20" fill="#eff6ff"/><text x="104" y="236" fill="#1e3a8a" font-family="Arial,sans-serif" font-size="22" font-weight="700">CUSTOMER TICKET</text><rect x="104" y="262" width="356" height="84" rx="14" fill="#dbeafe"/><text x="124" y="292" fill="#1e40af" font-family="Arial,sans-serif" font-size="17">“Can you confirm my order</text><text x="124" y="318" fill="#1e40af" font-family="Arial,sans-serif" font-size="17">status and next steps?”</text><rect x="104" y="366" width="356" height="68" rx="14" fill="#bfdbfe"/><text x="124" y="394" fill="#1e40af" font-family="Arial,sans-serif" font-size="17">AI draft: verify facts first</text><text x="124" y="418" fill="#1e40af" font-family="Arial,sans-serif" font-size="17">and check policy.</text><rect x="526" y="190" width="282" height="360" rx="20" fill="#dbeafe"/><text x="558" y="236" fill="#1e3a8a" font-family="Arial,sans-serif" font-size="22" font-weight="700">POLICY CHECK</text><g font-family="Arial,sans-serif" font-size="18" fill="#1e40af"><text x="558" y="292">✓ Account facts</text><text x="558" y="340">✓ Approved terms</text><text x="558" y="388">✓ Privacy</text><text x="558" y="436">✓ Escalation</text></g><path d="M950 220 L1050 258 V350 C1050 412 1008 460 950 495 C892 460 850 412 850 350 V258 Z" fill="#bfdbfe" stroke="#93c5fd" stroke-width="4"/><path d="M904 352 L938 386 L1000 316" fill="none" stroke="#93c5fd" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="950" y="540" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">HUMAN APPROVAL</text><text x="72" y="615" fill="#fff" font-family="Arial,sans-serif" font-size="20">Never let a polished draft invent a promise.</text></svg>