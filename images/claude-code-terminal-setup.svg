<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Claude Code terminal setup</title><desc id="desc">Editorial illustration of a terminal window, code lines, and a project folder.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#4c1d95"/></linearGradient></defs><rect width="1600" height="900" rx="36" fill="url(#bg)"/><circle cx="1300" cy="100" r="250" fill="#7c3aed" opacity=".22"/><g transform="translate(110 175)"><rect width="700" height="500" rx="24" fill="#0b1220" stroke="#a78bfa" stroke-width="3"/><path d="M0 66h700" stroke="#475569" stroke-width="2"/><circle cx="32" cy="32" r="9" fill="#fb7185"/><circle cx="62" cy="32" r="9" fill="#fbbf24"/><circle cx="92" cy="32" r="9" fill="#34d399"/><text x="130" y="40" font-family="Arial,sans-serif" font-size="20" fill="#cbd5e1">project terminal</text><text x="34" y="120" font-family="monospace" font-size="25" fill="#c4b5fd">$ claude --version</text><text x="34" y="166" font-family="monospace" font-size="23" fill="#94a3b8">Claude Code ready</text><text x="34" y="232" font-family="monospace" font-size="25" fill="#86efac">$ cd my-project</text><text x="34" y="278" font-family="monospace" font-size="25" fill="#86efac">$ claude</text><rect x="34" y="322" width="630" height="130" rx="14" fill="#172554"/><circle cx="72" cy="365" r="12" fill="#a78bfa"/><path d="M105 365h490M105 395h420M105 425h460" stroke="#64748b" stroke-width="9" stroke-linecap="round"/></g><g transform="translate(900 275)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5" fill="#c4b5fd">DEVELOPER WORKFLOW</text><text x="0" y="110" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#fff">Open Claude Code</text><text x="0" y="180" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#fff">in the Terminal</text><path d="M0 220h570" stroke="#a78bfa" stroke-width="5"/><text x="0" y="290" font-family="Arial,sans-serif" font-size="29" fill="#ede9fe">Install, sign in, enter your project,</text><text x="0" y="334" font-family="Arial,sans-serif" font-size="29" fill="#ede9fe">and review every proposed change.</text><g transform="translate(0 390)"><rect width="510" height="84" rx="16" fill="#312e81"/><path d="M34 28l20 14-20 14M65 56h24" stroke="#c4b5fd" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="52" font-family="Arial,sans-serif" font-size="25" fill="#fff">Terminal to project</text></g></g></svg>
