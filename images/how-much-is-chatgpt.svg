<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ChatGPT plan pricing guide</title>
<desc id="desc">Editorial illustration of a pricing comparison with a simple chatbot symbol, stacked plan cards, and a calculator.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101d35"/><stop offset="1" stop-color="#243e63"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70e1d1"/><stop offset="1" stop-color="#a2b8ff"/></linearGradient>
</defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/>
<circle cx="1310" cy="150" r="210" fill="#ffffff" opacity=".035"/>
<circle cx="220" cy="780" r="250" fill="#ffffff" opacity=".035"/>
<g transform="translate(130 150)">
  <rect x="0" y="0" width="420" height="570" rx="32" fill="#172944" stroke="#7189a9" stroke-opacity=".5" stroke-width="3"/>
  <rect x="42" y="48" width="110" height="110" rx="28" fill="url(#accent)"/>
  <path d="M76 91c0-18 14-32 32-32s32 14 32 32-14 32-32 32H91l-20 15 5-25" fill="none" stroke="#14243d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="42" y="218" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="700">ChatGPT plans</text>
  <rect x="42" y="258" width="336" height="82" rx="18" fill="#263d5d"/>
  <text x="66" y="291" fill="#dbe8ff" font-family="Arial, sans-serif" font-size="20">FREE</text><text x="66" y="321" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">$0</text>
  <rect x="42" y="360" width="336" height="82" rx="18" fill="#263d5d"/>
  <text x="66" y="393" fill="#dbe8ff" font-family="Arial, sans-serif" font-size="20">GO / PLUS</text><text x="66" y="423" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Compare features</text>
  <rect x="42" y="462" width="336" height="66" rx="18" fill="#263d5d"/>
  <text x="66" y="503" fill="#dbe8ff" font-family="Arial, sans-serif" font-size="20">PRO + WORK PLANS</text>
</g>
<g transform="translate(700 190)">
  <text x="0" y="0" fill="#a9f2e7" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="5">A PRACTICAL GUIDE</text>
  <text x="0" y="112" fill="#ffffff" font-family="Arial, sans-serif" font-size="76" font-weight="700">How much</text>
  <text x="0" y="202" fill="#ffffff" font-family="Arial, sans-serif" font-size="76" font-weight="700">does ChatGPT</text>
  <text x="0" y="292" fill="#ffffff" font-family="Arial, sans-serif" font-size="76" font-weight="700">cost?</text>
  <rect x="0" y="340" width="520" height="4" rx="2" fill="url(#accent)"/>
  <text x="0" y="405" fill="#d4e0f2" font-family="Arial, sans-serif" font-size="29">Plans, billing and limits</text>
  <text x="0" y="450" fill="#d4e0f2" font-family="Arial, sans-serif" font-size="29">explained clearly.</text>
</g>
<g transform="translate(1190 595) rotate(7)">
  <rect x="0" y="0" width="210" height="230" rx="25" fill="#e6eefb"/>
  <rect x="24" y="24" width="162" height="50" rx="10" fill="#172944"/>
  <text x="105" y="58" text-anchor="middle" fill="#a9f2e7" font-family="Arial, sans-serif" font-size="26" font-weight="700">$ / mo</text>
  <g fill="#9aacc5"><rect x="24" y="96" width="44" height="32" rx="8"/><rect x="83" y="96" width="44" height="32" rx="8"/><rect x="142" y="96" width="44" height="32" rx="8"/><rect x="24" y="143" width="44" height="32" rx="8"/><rect x="83" y="143" width="44" height="32" rx="8"/><rect x="142" y="143" width="44" height="32" rx="8"/></g>
</g>
</svg>