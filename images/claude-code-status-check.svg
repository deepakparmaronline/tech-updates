<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Claude Code status check</title><desc id="desc">A terminal window, service indicator, and local diagnostic commands.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d24"/><stop offset="1" stop-color="#29434a"/></linearGradient><linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b3038"/><stop offset="1" stop-color="#13232b"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1310" cy="140" r="230" fill="#6ec4a8" opacity=".12"/><circle cx="180" cy="760" r="260" fill="#5d9ea3" opacity=".12"/><rect x="170" y="155" width="1260" height="590" rx="34" fill="url(#terminal)" stroke="#7da6a8" stroke-width="3"/><path d="M170 220H1430" stroke="#6e8c92" stroke-width="3"/><g><circle cx="215" cy="188" r="11" fill="#f38d7b"/><circle cx="250" cy="188" r="11" fill="#f5cb78"/><circle cx="285" cy="188" r="11" fill="#77d5b3"/></g><text x="340" y="198" font-family="Arial,sans-serif" font-size="24" fill="#c6d8d9">CLAUDE CODE STATUS CHECK</text><rect x="230" y="275" width="1140" height="108" rx="18" fill="#223c42" stroke="#527a7b" stroke-width="2"/><circle cx="300" cy="329" r="26" fill="#4ed19a"/><path d="M287 329L297 339L315 316" stroke="#103c31" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="322" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#e8f8f2">SERVICE STATUS</text><text x="355" y="357" font-family="Arial,sans-serif" font-size="22" fill="#9bdac3">Check the official component and incident history</text><g font-family="monospace" font-size="25"><text x="245" y="455" fill="#81dfbd">$ claude doctor</text><text x="245" y="510" fill="#d0e3e3">Check local setup and configuration</text><text x="245" y="565" fill="#81dfbd">$ /mcp</text><text x="245" y="620" fill="#d0e3e3">Check connected server status</text></g><rect x="1050" y="445" width="260" height="150" rx="22" fill="#e9f8f1"/><circle cx="1180" cy="495" r="23" fill="#43bf8b"/><path d="M1169 495L1177 503L1192 485" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1180" y="548" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#214e42">CHECK FIRST</text><text x="800" y="815" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" letter-spacing="3" fill="#b8d9d6">SERVICE INCIDENT OR LOCAL ISSUE?</text></svg>