<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode alternatives for developers</title>
  <desc id="desc">Editorial illustration of a code editor, terminal window, and connected AI coding tools.</desc>
  <rect width="1600" height="900" fill="#111827"/>
  <circle cx="1340" cy="180" r="250" fill="#164e63" opacity=".45"/>
  <circle cx="230" cy="750" r="260" fill="#312e81" opacity=".4"/>
  <rect x="330" y="170" width="940" height="520" rx="28" fill="#1f2937" stroke="#93c5fd" stroke-width="4"/>
  <path d="M330 225 H1270" stroke="#475569" stroke-width="3"/>
  <circle cx="375" cy="198" r="9" fill="#fca5a5"/>
  <circle cx="407" cy="198" r="9" fill="#fcd34d"/>
  <circle cx="439" cy="198" r="9" fill="#86efac"/>
  <rect x="385" y="275" width="370" height="350" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <g font-family="monospace" font-size="24">
    <text x="420" y="330" fill="#93c5fd">function reviewCode() {</text>
    <text x="450" y="380" fill="#a7f3d0">inspectDiff();</text>
    <text x="450" y="430" fill="#c4b5fd">runTests();</text>
    <text x="450" y="480" fill="#fcd34d">checkSecurity();</text>
    <text x="420" y="530" fill="#93c5fd">}</text>
    <text x="420" y="585" fill="#94a3b8">// human review matters</text>
  </g>
  <rect x="800" y="275" width="400" height="140" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
  <text x="1000" y="330" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">AI Coding Agent</text>
  <text x="1000" y="370" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bfdbfe" text-anchor="middle">Plan • Edit • Test</text>
  <rect x="800" y="455" width="400" height="170" rx="18" fill="#134e4a" stroke="#5eead4" stroke-width="3"/>
  <text x="1000" y="505" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Choose Your Workflow</text>
  <text x="1000" y="550" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ccfbf1" text-anchor="middle">Terminal • IDE • Hosted</text>
  <text x="1000" y="585" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ccfbf1" text-anchor="middle">Model • Permissions • Cost</text>
  <path d="M755 360 H800 M755 530 H800" stroke="#7dd3fc" stroke-width="4"/>
  <text x="800" y="780" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#e5e7eb" text-anchor="middle">OPENCODE ALTERNATIVES</text>
  <text x="800" y="820" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">Compare workflow fit, permissions, and review effort</text>
</svg>