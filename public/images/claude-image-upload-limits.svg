<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Claude image upload limits</title><desc id="d">Image cards flow into a usage meter and a focused conversation workspace.</desc><rect width="1600" height="900" rx="40" fill="#342c2b"/><g fill="#f6eee7" stroke="#d9a47d" stroke-width="6"><rect x="180" y="300" width="250" height="210" rx="22"/><rect x="475" y="300" width="250" height="210" rx="22"/><rect x="770" y="300" width="250" height="210" rx="22"/></g><g fill="#bd8060"><circle cx="260" cy="370" r="24"/><path d="M210 470L285 395L350 470Z"/><circle cx="555" cy="370" r="24"/><path d="M505 470L580 395L645 470Z"/><circle cx="850" cy="370" r="24"/><path d="M800 470L875 395L940 470Z"/></g><path d="M1030 405H1120" stroke="#f0c19d" stroke-width="10"/><rect x="1120" y="285" width="300" height="250" rx="28" fill="#f8eee5" stroke="#d9a47d" stroke-width="6"/><rect x="1165" y="360" width="210" height="32" rx="16" fill="#d5c4b6"/><rect x="1165" y="360" width="135" height="32" rx="16" fill="#c37c56"/><g fill="#45342e" font-family="Arial" text-anchor="middle"><text x="1270" y="335" font-size="28" font-weight="700">Usage</text><text x="1270" y="445" font-size="22">Plan • Context</text><text x="1270" y="480" font-size="22">File • Session</text></g><text x="800" y="170" fill="#fff4eb" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700">Image support is not an unlimited promise</text><text x="800" y="700" fill="#f1d8c8" text-anchor="middle" font-family="Arial" font-size="32">Keep inputs focused and verify current account limits</text></svg>