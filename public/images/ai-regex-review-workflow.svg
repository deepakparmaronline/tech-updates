<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI generated regular expression review</title><desc id="d">A regex pattern is checked against valid, invalid, edge case, and performance test groups.</desc><rect width="1600" height="900" rx="40" fill="#1b2b43"/><rect x="210" y="170" width="1180" height="180" rx="28" fill="#f4f8ff" stroke="#7bd1c3" stroke-width="6"/><text x="800" y="245" fill="#203e59" font-family="monospace" font-size="40" text-anchor="middle">^(ID)-[0-9]{4}-[A-Z]{2}$</text><text x="800" y="300" fill="#42677e" font-family="Arial" font-size="24" text-anchor="middle">Draft pattern • Explain • Confirm engine</text><g fill="#f3fbff" stroke="#7abbd4" stroke-width="5"><rect x="150" y="500" width="280" height="170" rx="22"/><rect x="490" y="500" width="280" height="170" rx="22"/><rect x="830" y="500" width="280" height="170" rx="22"/><rect x="1170" y="500" width="280" height="170" rx="22"/></g><g fill="#1c4057" font-family="Arial" text-anchor="middle"><text x="290" y="565" font-size="29" font-weight="700">Valid cases</text><text x="290" y="610" font-size="22">Expected matches</text><text x="630" y="565" font-size="29" font-weight="700">Invalid cases</text><text x="630" y="610" font-size="22">Expected rejects</text><text x="970" y="565" font-size="29" font-weight="700">Edge cases</text><text x="970" y="610" font-size="22">Unicode • Empty</text><text x="1310" y="565" font-size="29" font-weight="700">Performance</text><text x="1310" y="610" font-size="22">Long input • ReDoS</text></g><text x="800" y="780" fill="#d9f4f0" font-family="Arial" font-size="34" text-anchor="middle">A pattern is ready only after repeatable tests</text></svg>