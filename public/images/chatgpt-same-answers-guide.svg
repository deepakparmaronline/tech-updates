<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Why ChatGPT answers can differ</title><desc id="d">Two response cards branch from the same prompt.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102f3b"/><stop offset="1" stop-color="#164e63"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="72" y="82" fill="#5eead4" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">MODEL BEHAVIOR</text><text x="72" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="45" font-weight="700">Same question. Different replies.</text><rect x="340" y="190" width="520" height="82" rx="18" fill="#f0fdfa"/><text x="600" y="223" text-anchor="middle" fill="#134e4a" font-family="Arial,sans-serif" font-size="20" font-weight="700">SAME PROMPT</text><text x="600" y="250" text-anchor="middle" fill="#134e4a" font-family="Arial,sans-serif" font-size="18">Same words, different context?</text><path d="M600 272 V315 H320 V350 M600 315 H880 V350" fill="none" stroke="#5eead4" stroke-width="5"/><rect x="80" y="350" width="470" height="180" rx="20" fill="#f0fdfa"/><rect x="650" y="350" width="470" height="180" rx="20" fill="#e0f2fe"/><text x="118" y="392" fill="#0f766e" font-family="Arial,sans-serif" font-size="20" font-weight="700">REPLY A</text><text x="688" y="392" fill="#0369a1" font-family="Arial,sans-serif" font-size="20" font-weight="700">REPLY B</text><g fill="#5eead4" opacity=".7"><rect x="118" y="420" width="340" height="12" rx="6"/><rect x="118" y="445" width="285" height="12" rx="6"/><rect x="118" y="470" width="310" height="12" rx="6"/><rect x="688" y="420" width="350" height="12" rx="6"/><rect x="688" y="445" width="285" height="12" rx="6"/><rect x="688" y="470" width="315" height="12" rx="6"/></g><text x="600" y="595" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21">Compare evidence, not only wording.</text></svg>