y</text><text x="1270" y="420" text-anchor="middle" font-size="28" font-family="Arial,sans-serif" font-weight="700">Accuracy</text></g><g stroke="#67e8f9" stroke-width="6" fill="none" opacity=".85"><path d="M500 400 L625 400"/><path d="M975 400 L1100 400"/><path d="M800 740 L800 770"/></g><text x="800" y="100" text-anchor="middle" font-size="26" letter-spacing="5" font-family="Arial,sans-serif" fill="#bae6fd">USE AI WITH CARE</text><text x="800" y="865" text-anchor="middle" font-size="24" font-family="Arial,sans-serif" fill="#cbd5e1">Protect data • Check facts • Secure accounts</text></svg>