<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Gemini video usage limits illustration</title><desc id="desc">Three abstract video frames sit beside a usage meter and refresh clock, representing changing video generation allowances.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1b31"/><stop offset="1" stop-color="#1d3b64"/></linearGradient><linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient></defs><rect width="1600" height="900" rx="44" fill="url(#bg)"/><circle cx="1350" cy="140" r="260" fill="#60a5fa" opacity=".12"/><g transform="translate(140 210)"><rect x="0" y="0" width="310" height="220" rx="24" fill="#e0f2fe"/><rect x="22" y="22" width="266" height="176" rx="16" fill="url(#frame)"/><circle cx="85" cy="82" r="26" fill="#fef3c7"/><path d="M30 175l70-58 55 42 58-72 65 88" fill="#0f766e"/><path d="M135 78l50 30-50 30z" fill="#fff" opacity=".9"/></g><g transform="translate(500 210)"><rect x="0" y="0" width="310" height="220" rx="24" fill="#e0f2fe"/><rect x="22" y="22" width="266" height="176" rx="16" fill="#818cf8"/><circle cx="200" cy="72" r="35" fill="#fef3c7"/><path d="M30 180l75-64 60 38 65-58 45 84" fill="#155e75"/><path d="M135 78l50 30-50 30z" fill="#fff" opacity=".9"/></g><g transform="translate(860 210)"><rect x="0" y="0" width="310" height="220" rx="24" fill="#e0f2fe"/><rect x="22" y="22" width="266" height="176" rx="16" fill="#34d399"/><circle cx="95" cy="80" r="28" fill="#fef3c7"/><path d="M30 180l70-58 55 40 60-70 65 88" fill="#1e3a8a"/><path d="M135 78l50 30-50 30z" fill="#fff" opacity=".9"/></g><g transform="translate(180 560)"><text x="0" y="0" font-size="28" font-family="Arial,sans-serif" font-weight="700" fill="#e0f2fe">USAGE</text><rect x="0" y="30" width="700" height="32" rx="16" fill="#334155"/><rect x="0" y="30" width="470" height="32" rx="16" fill="#38bdf8"/><text x="0" y="100" font-size="22" font-family="Arial,sans-serif" fill="#cbd5e1">Allowance depends on plan and current limits</text></g><g transform="translate(1080 535)"><circle cx="110" cy="65" r="72" fill="#dbeafe" opacity=".95"/><path d="M110 20v48l32 20" fill="none" stroke="#1e40af" stroke-width="10" stroke-linecap="round"/><path d="M72 2a78 78 0 0 1 91 8" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/><text x="110" y="175" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="700" fill="#e0f2fe">Refresh window</text></g><text x="800" y="100" text-anchor="middle" font-size="26" letter-spacing="5" font-family="Arial,sans-serif" fill="#bfdbfe">LIMITS CAN CHANGE</text><text x="800" y="845" text-anchor="middle" font-size="24" font-family="Arial,sans-serif" fill="#cbd5e1">Check the notice in your own account</text></svg>