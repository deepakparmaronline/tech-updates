<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Claude Code plan and billing illustration</title><desc id="desc">A terminal prompt is connected to three plan cards that distinguish free access, subscription access, and separate API billing.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#3f2a23"/></linearGradient><linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#292524"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs><rect width="1600" height="900" rx="44" fill="url(#bg)"/><circle cx="1300" cy="120" r="260" fill="#fb923c" opacity=".10"/><rect x="170" y="135" width="1260" height="360" rx="30" fill="url(#terminal)" stroke="#78716c" stroke-width="3"/><path d="M170 200h1260" stroke="#78716c" stroke-width="3"/><circle cx="215" cy="168" r="10" fill="#fca5a5"/><circle cx="250" cy="168" r="10" fill="#fde68a"/><circle cx="285" cy="168" r="10" fill="#86efac"/><text x="245" y="280" font-size="34" font-family="monospace" fill="#86efac">$ claude</text><text x="245" y="340" font-size="30" font-family="monospace" fill="#e7e5e4">check account and usage</text><rect x="245" y="380" width="530" height="15" rx="7" fill="#57534e"/><rect x="245" y="415" width="370" height="15" rx="7" fill="#57534e"/><g><rect x="170" y="565" width="360" height="230" rx="28" fill="#f5f5f4"/><text x="350" y="625" text-anchor="middle" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#44403c">Free</text><circle cx="350" cy="690" r="35" fill="#e7e5e4"/><path d="M332 690h36" stroke="#78716c" stroke-width="8" stroke-linecap="round"/><text x="350" y="755" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#57534e">No Claude Code access</text></g><g><rect x="620" y="565" width="360" height="230" rx="28" fill="#ffedd5"/><text x="800" y="625" text-anchor="middle" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#9a3412">Pro / Max</text><circle cx="800" cy="690" r="35" fill="#fed7aa"/><path d="M782 690l13 13 25-30" fill="none" stroke="#9a3412" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="755" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#7c2d12">Subscription limits apply</text></g><g><rect x="1070" y="565" width="360" height="230" rx="28" fill="#dbeafe"/><text x="1250" y="625" text-anchor="middle" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#1e3a8a">API billing</text><circle cx="1250" cy="690" r="35" fill="#bfdbfe"/><path d="M1233 690h34m-17-17v34" stroke="#1e40af" stroke-width="7" stroke-linecap="round"/><text x="1250" y="755" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#1e40af">Separate usage charges</text></g><text x="800" y="90" text-anchor="middle" font-size="26" letter-spacing="5" font-family="Arial,sans-serif" fill="#fed7aa">CHECK THE BILLING PATH</text><text x="800" y="855" text-anchor="middle" font-size="24" font-family="Arial,sans-serif" fill="#e7e5e4">Install the tool is not free model usage</text></svg>