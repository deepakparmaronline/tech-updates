<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Claude Code in VS Code workflow</title><desc id="d">An editor with code, proposed changes and test checks.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211a38"/><stop offset="1" stop-color="#43306a"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="72" y="82" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">AI CODING WORKFLOW</text><text x="72" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="45" font-weight="700">Edit. Review. Test.</text><rect x="72" y="190" width="1056" height="380" rx="20" fill="#171323" stroke="#c4b5fd" stroke-width="2"/><rect x="72" y="190" width="1056" height="48" rx="20" fill="#302448"/><circle cx="105" cy="214" r="7" fill="#fb7185"/><circle cx="130" cy="214" r="7" fill="#fbbf24"/><circle cx="155" cy="214" r="7" fill="#34d399"/><text x="195" y="221" fill="#e9d5ff" font-family="Arial,sans-serif" font-size="18">project.ts</text><rect x="95" y="260" width="390" height="270" rx="12" fill="#221b32"/><text x="120" y="300" fill="#c4b5fd" font-family="monospace" font-size="18">function update() {</text><text x="120" y="338" fill="#f0abfc" font-family="monospace" font-size="18">  validateInput();</text><text x="120" y="376" fill="#c4b5fd" font-family="monospace" font-size="18">  saveChanges();</text><text x="120" y="414" fill="#c4b5fd" font-family="monospace" font-size="18">}</text><rect x="510" y="260" width="290" height="270" rx="12" fill="#1e293b"/><text x="536" y="300" fill="#93c5fd" font-family="Arial,sans-serif" font-size="19" font-weight="700">DIFF REVIEW</text><rect x="536" y="325" width="238" height="34" rx="6" fill="#14532d"/><text x="548" y="348" fill="#bbf7d0" font-family="monospace" font-size="16">+ add a test</text><rect x="536" y="370" width="238" height="34" rx="6" fill="#7f1d1d"/><text x="548" y="393" fill="#fecaca" font-family="monospace" font-size="16">- remove old check</text><rect x="826" y="260" width="278" height="270" rx="12" fill="#25203a"/><text x="850" y="300" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="19" font-weight="700">VERIFY</text><g fill="#fff" font-family="Arial,sans-serif" font-size="17"><text x="850" y="350">✓ Diff read</text><text x="850" y="395">✓ Tests run</text><text x="850" y="440">✓ Secrets safe</text><text x="850" y="485">✓ Human review</text></g><text x="72" y="615" fill="#fff" font-family="Arial,sans-serif" font-size="20">An assistant proposes changes. Your tests decide what stays.</text></svg>